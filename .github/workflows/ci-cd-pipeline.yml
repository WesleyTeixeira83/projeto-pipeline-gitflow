name: CI/CD Pipeline Simples

# Quando a pipeline será executada: em todo push e pull request para a branch 'main'
on:
  push:
    branches:
      - main
      - develop
      - feature/melhoria-mensagem
  pull_request:
    branches:
      - main

# Definição dos 'jobs' (trabalhos) que serão executados
jobs:
  build-and-test:
    name: Build & Test
    # O ambiente (máquina virtual) onde o job irá rodar
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout (Baixar o código do repo)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar o Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use a versão que desejar

      # 3. Instalar Dependências (se houver)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt # Descomente se tiver um arquivo requirements.txt

      # 4. Rodar Testes (Etapa CRUCIAL de CI)
      - name: Run Tests
        run: python -m unittest test_app.py

      # 5. Build/Compilação (Opcional, mas bom para mostrar)
      - name: Simple Build Step
        run: echo "Code build complete. Ready for deployment."

  # Job de "Deploy" (depende do sucesso do job de teste)
  deploy:
    name: Deploy Simulation
    runs-on: ubuntu-latest
    needs: [build-and-test] # Este job só executa se o 'build-and-test' for SUCESSO
    if: github.ref == 'refs/heads/main' # Só executa deploy na branch 'main'

    steps:
      - name: Simulated Deployment
        run: |
          echo "Starting deployment process to production environment..."
          echo "Deployment to PROD successful!"